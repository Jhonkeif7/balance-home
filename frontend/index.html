<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/BalanceHome_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Balance Home — compras, tareas y finanzas del hogar." />
    <title>Balance Home</title>
    <script>
      // Aplica el tema guardado antes del primer render (evita parpadeo y cubre el login).
      try {
        var t = localStorage.getItem("theme") === "light" ? "light" : "dark";
        document.documentElement.classList.add(t);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
